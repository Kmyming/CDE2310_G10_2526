name: Qodo Merge AI Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created, edited]

jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
    steps:
      - name: Verify Secret Exists
        run: |
          if [ -z "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "🚨 FATAL ERROR: GitHub Actions sees an EMPTY secret. The key is missing!"
            exit 1
          else
            echo "✅ SUCCESS: GitHub Actions successfully loaded a secret string!"
          fi

      # --- NEW STEP: THE COMMIT SCRAPER ---
      - name: Auto-Inject Commits into PR Body
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # 1. Fetch all commit messages in this PR and format them as bullet points
          COMMITS=$(gh api repos/$REPO/pulls/$PR_NUMBER/commits --jq '.[].commit.message' | sed 's/^/- /')
          
          # 2. Fetch the current PR description
          CURRENT_BODY=$(gh pr view $PR_NUMBER --json body --jq '.body')
          
          # 3. Strip out any old auto-generated logs to prevent duplicates if you push more code later
          CLEAN_BODY=$(echo "$CURRENT_BODY" | awk '/### 🤖 Auto-Generated Commit Log/{exit} {print}')
          
          # 4. Combine the clean description with the fresh commit list
          NEW_BODY=$(printf "%s\n\n### 🤖 Auto-Generated Commit Log\n%s" "$CLEAN_BODY" "$COMMITS")
          
          # 5. Update the PR description live on GitHub
          gh pr edit $PR_NUMBER --body "$NEW_BODY"
      # ------------------------------------

      - name: Run PR Agent
        uses: qodo-ai/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 1. Satisfy Qodo's core validation check so it doesn't drop the process
          OPENAI_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 2. Map the Google key using exact dot-notation
          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 3. Target the correct 2.5 model using dot-notation
          config.model: "gemini/gemini-2.5-flash"
          config.fallback_models: '["gemini/gemini-2.5-flash"]'
          config.log_level: "DEBUG"