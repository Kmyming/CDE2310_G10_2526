name: Qodo Merge AI Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created, edited]

jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
    steps:
    # --- MISSING STEP RESTORED ---
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 
      # -----------------------------

      - name: Verify Secret Exists
        run: |
          if [ -z "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "🚨 FATAL ERROR: GitHub Actions sees an EMPTY secret. The key is missing!"
            exit 1
          else
            echo "✅ SUCCESS: GitHub Actions successfully loaded a secret string!"
          fi

      # --- NEW STEP: THE COMMIT SCRAPER ---
      - name: Auto-Inject Commits into PR Body
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          # Force Git to download the base branch so we can compare against it
          git fetch origin $BASE_REF
          
          # Fetch commits instantly from the local git tree
          COMMITS=$(git log origin/$BASE_REF..HEAD --pretty=format:"- %s")
          
          # Fetch current PR body
          CURRENT_BODY=$(gh pr view $PR_NUMBER --json body --jq '.body')
          if [ -z "$CURRENT_BODY" ]; then CURRENT_BODY=" "; fi
          
          # Clean old logs and safely write to text file
          CLEAN_BODY=$(echo "$CURRENT_BODY" | awk '/### 🤖 Auto-Generated Commit Log/{exit} {print}')
          echo "$CLEAN_BODY" > pr_body.txt
          echo "" >> pr_body.txt
          echo "### 🤖 Auto-Generated Commit Log" >> pr_body.txt
          echo "$COMMITS" >> pr_body.txt
          
          # Push the text file to update the PR
          gh pr edit $PR_NUMBER --body-file pr_body.txt
      # ------------------------------------

      - name: Run PR Agent
        uses: qodo-ai/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 1. Satisfy Qodo's core validation check so it doesn't drop the process
          OPENAI_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 2. Map the Google key using exact dot-notation
          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 3. Target the correct 2.5 model using dot-notation
          config.model: "gemini/gemini-2.5-flash"
          config.fallback_models: '["gemini/gemini-2.5-flash"]'
          config.log_level: "DEBUG"
          github_action_config.auto_review: "false"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"
          github_action_config.pr_actions: "['update_changelog']"