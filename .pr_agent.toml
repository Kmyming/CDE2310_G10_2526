[pr_update_changelog]
push_changelog_changes = true
changelog_file = "CHANGELOG.md"
extra_instructions = """
You are a senior robotics engineer. Analyze the PR diff and commit messages to update the changelog.

CRITICAL OVERWRITE RULE (READ CAREFULLY):
You are rewriting the ENTIRE CHANGELOG.md file from top to bottom. You MUST output the full file structure in this exact order:
1. Print the `# Changelog` header and introductory paragraphs EXACTLY as they appear in the original file.
2. Print your NEW `## [VERSION]` release block immediately below the intro paragraphs.
3. Print the rest of the original release history EXACTLY as it was. 

Do NOT put the new version above the main `# Changelog` title. Do not duplicate history.

VERSIONING MATH:
Find the HIGHEST existing version number in the file. Use it as your baseline.
- MAJOR BUMP (X.0.0): Triggered ONLY if there is a `feat` AND the exact word "MAJOR" appears in the commit message/PR. 
- MINOR BUMP (0.X.0): Triggered if there is a `feat` (and no "MAJOR"). 
- PATCH BUMP (0.0.X): Triggered if there is a `fix`, `docs`, or `test`.

THE BINARY BLINDSPOT:
If you see modified binary files (.SLDPRT, .SLDASM, .STL), you MUST read the PR's commit messages to understand the physical hardware changes and log them as `feat(cad)` or `fix(cad)`.

ADDITIONAL CONSTRAINTS:
1. Replace [VERSION] with your calculated SemVer number. 
2. Replace YYYY-MM-DD with today's date. 
3. ONLY use these four conventional prefixes: feat, fix, docs, test.
4. Include the (scope) based on the specific ROS 2 package or module (e.g., architecture, launch, navigation).
5. Be highly specific about technical implementations, file names, and parameter changes.
6. Omit any empty category headers.
"""