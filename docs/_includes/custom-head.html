<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<style>
  .site-nav,
  .site-header .page-link,
  .rss-subscribe,
  .feed-subscribe {
    display: none !important;
  }

  /* Minima v3 renders feed as a social link icon in footer. */
  .social-media-list a[href$="/feed.xml"],
  .social-media-list a[href*="/feed.xml"],
  .social-media-list a[title*="syndication feed" i] {
    display: none !important;
  }

  .post-header {
    display: none !important;
  }
</style>
<script>
  function renderMermaidBlocks() {
    const codeBlocks = document.querySelectorAll('pre code.language-mermaid, pre code.mermaid');

    codeBlocks.forEach((codeBlock, index) => {
      const pre = codeBlock.parentElement;
      if (!pre || pre.dataset.mermaidProcessed === 'true') {
        return;
      }

      const container = document.createElement('div');
      container.className = 'mermaid';
      container.id = `mermaid-diagram-${index}`;
      container.textContent = codeBlock.textContent;

      pre.dataset.mermaidProcessed = 'true';
      pre.replaceWith(container);
    });

    if (window.mermaid) {
      window.mermaid.initialize({
        startOnLoad: false,
        securityLevel: 'loose',
        theme: 'default'
      });

      window.mermaid.run({ querySelector: '.mermaid' });
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', renderMermaidBlocks);
  } else {
    renderMermaidBlocks();
  }
</script>
